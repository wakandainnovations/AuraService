# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aura
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=mukundv
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# For production, set JWT_SECRET environment variable
# Development default is provided below for local testing
jwt.expiration=86400000

# Logging
logging.level.com.aura.service=INFO
logging.level.org.springframework.security=DEBUG

# Box-office backtest: directory for per-run prediction-vs-actual log files (see
# BoxOfficeBacktestWorkerImpl). Relative to the working directory the app is started from.
backtest.log.dir=logs/box-office-backtest

# Local directory of entity poster images, keyed by filename (see EntityImageBackfill, which matches
# files here against managed_entities.name to populate image_path, and EntityController's /image
# endpoint, which serves them). Override via ENTITY_IMAGES_PATH env var.
entity.images.base-path=${ENTITY_IMAGES_PATH:/Users/mukundv/Documents/work/space/images}

# Force servlet stack (Web MVC) even though spring-boot-starter-webflux is on the classpath for WebClient.
spring.main.web-application-type=servlet

# AuraMath upstream proxy configuration
# Override via AURAMATH_BASE_URL env var.
auramath.base-url=${AURAMATH_BASE_URL:http://localhost:8081}
auramath.connect-timeout-ms=30000
auramath.read-timeout-ms=60000
auramath.sync-read-timeout-ms=600000
# /v1/marketing/** budget (15s per spec — channel-strategy/potential-* can be slow on cold cache)
auramath.marketing-timeout-ms=15000
auramath.cache.default-ttl-seconds=60
auramath.cache.categories-ttl-seconds=300
# /v1/marketing/{genre,party,celebrity} list endpoints
auramath.cache.list-ttl-seconds=300
auramath.cache.max-entries=1000

# LLM
llm.url=http://localhost:1025/api/chat
llm.prompt.generate.reply="Role: Assuming you are a Strategic Brand Communications Specialist, do your research on how \
  you would approach crisis management, public affairs and public communication. Your goal is to manage the digital \
  reputation of [Managed Entity]. \n\nTask: Analyze the provided social media post and its sentiment. \
  Write a response that maximizes brand value and fosters a community of support. \n\nGuidelines based on Sentiment:\n\n\
  If the sentiment is POSITIVE: Be an "Amplifier." Express genuine gratitude, use enthusiastic language, and build on \
  their specific praise. Aim to turn a casual fan into a "superfan."\n\nIf the sentiment is NEGATIVE: Be a "Diplomat." \
  Do not be defensive or aggressive. Instead, use empathy to validate their feelings while subtly reframing the narrative. \
  If the criticism is subjective (e.g., "I didn't like the plot"), offer a different perspective or highlight a different \
  strength of the project/person.\n\nIf the sentiment is NEUTRAL: Be an "Engager." Add a piece of interesting trivia, a \
  "did you know," or ask a leading question to spark further positive discussion.\n\nConstraint: Keep the tone authentic \
  to the platform (e.g., witty for X/Twitter, visual/emotive for Instagram). Avoid sounding like a press release.\n\n\
  Output Formatting Constraint: Provide ONLY the final response text. Do not include any introductory text, concluding \
  remarks, explanations of your strategy, or analysis of why the response was written. Your entire output should be the \
  social media reply and nothing else.\nPost Content: "[Paste the user's post here]" Post Sentiment: \
  [Positive / Negative / Neutral]"
llm.prompt.generate.reply.from.template="Role: Assuming you are a Strategic Brand Communications Specialist, your goal \
  is to manage the digital reputation of [Managed Entity]. \n\nThe brand maintains a preferred reply template and a \
  desired tone. Use the template below as the foundation for your response: keep its intent, structure, and voice, and \
  write in the desired tone. Adapt the wording so it fits the specific social media post and its sentiment naturally \
  rather than reading as a canned message.\n\nDesired Tone: [Template Tone]\n\nReply Template:\n[Template Body]\n\nTask: \
  Adapt the template above into a reply to the social media post below, maintaining the desired tone and accounting for \
  the post's sentiment.\n\nOutput Formatting Constraint: Provide ONLY the final response text. Do not include any \
  introductory text, concluding remarks, explanations of your strategy, or analysis of why the response was written. \
  Your entire output should be the social media reply and nothing else.\nPost Content: "[Paste the user's post here]" \
  Post Sentiment: [Positive / Negative / Neutral]"
llm.prompt.generate.crisis.plan="Role: You are an expert Crisis Management Consultant with 20 years of experience in \
  corporate communications and strategic risk mitigation.\n\nTask: Develop a comprehensive, 5-stage Crisis Management \
  Plan for [Managed Entity] regarding the following scenario: [Crisis Description].\n\nPlease expand on the following \
  framework with actionable details:\n\nImmediate \
  Response (0 to 4 Hours): > * Draft a 150-word holding statement for the press.\n\nIdentify the internal \
  "Crisis Command Team" roles required.\n\nList the first three technical or operational steps to "stop the bleeding."\n\
  \nAssessment & Intelligence: > * Define the criteria used to categorize this crisis level (Green, Yellow, Red).\n\n\
  List five specific questions the investigation team must answer within the first 12 hours.\n\nStakeholder Communication \
  Strategy: > * Create a table identifying key messages for: Employees, Investors, Customers, and Regulatory Bodies.\n\n\
  Suggest the most appropriate channel for each (e.g., Town Hall, Email, Direct Call).\n\nAction & Remediation: > * \
  Outline three long-term corrective measures to prevent recurrence.\n\nPropose a "Customer Restitution" or "Goodwill" \
  plan if applicable.\n\nMonitoring & Post-Mortem: > * Identify three Key Performance Indicators (KPIs) to track brand \
  sentiment recovery.\n\nProvide a template for a "Lessons Learned" report to be presented to the Board of Directors.\n\n\
  Tone: Professional, transparent, and proactive. Avoid corporate jargon where possible."
llm.prompt.generate.ally.dm="Role: You are a community-relations specialist for [Managed Entity]. \
  Draft a short, personalized direct-message template (max 2 sentences, friendly, platform-appropriate, no emojis, \
  no hashtags) inviting a known supporter to amplify a positive moment about [Managed Entity]. \n\n\
  Supporter handle: [Ally Handle]\nPrimary platform: [Ally Platform]\nInfluence tier: [Ally Tier]\n\
  Recent mention to react to: \"[Mention Content]\"\n\n\
  Output ONLY the DM text. No preamble, no quotes, no explanation."
llm.prompt.generate.prediction="Role: You are a Senior Box Office Analyst specializing in the Tamil film industry. Your \
  goal is to predict the financial performance of a movie using a provided historical dataset and three specific \
  real-time inputs: Release Date, Positivity Ratio, and Sentiment Score. \
  \n\nTask: Analyze the user's input against the \
  historical performance benchmarks provided in the context below. Provide a detailed prediction report. \
  \n\n\ Reference Example (Ground Truth): The following is a historical data point used to calibrate your weighting of \
  Sentiment vs. Collection: \
  \n\n Input: {"releaseDate": "2026-01-10", "releaseDay": "Saturday", "sentimentScore": 71, \
  "positivityRatio": 62.0} \
  \n\n Actual Result: * Opening Day: Rs.12.5 Cr \
  \n\n Day 1: Rs.10.1 Cr \
  \n\n Total Lifetime: Rs.52.36 Cr \
  \n\n Observation: Note the decay rate and how a 71/62 sentiment profile correlates to a ~Rs.50cr total \
  against a Rs.12.5cr opening. The movie was released in theaters on 10 January 2026, during the Pongal week. The film \
  received mixed reviews from critics and underperformed at the box office, grossing Rs.79.4 crore against a production \
  budget of Rs.150 crore - Rs.250 crore. \
  \n\n Historical Data Context: [PASTE THE DATA FROM YOUR ORIGINAL REQUEST HERE] \
  \n\n Current Input Data for Prediction: \n\n Release Date: [Insert Date] \
  \n\n Positivity Ratio: [Insert Ratio] \
  \n\n Sentiment Score: [Insert Score] \n\n Response Format & Constraints: \
  \n\n Please provide the response strictly in JSON \
  format. \
  \n\n CRITICAL RULE: Do NOT use Markdown tables, ASCII tables, or any grid-based tabular formatting within the \
  JSON string values. All analysis, comparisons, or lists must be provided as plain text or simple comma-separated \
  strings. Tabular data spoils the UI rendering and must be avoided. \
  \n\n Required JSON Structure: \
  \n\n JSON \
  \n\n { \
  \n\n "prediction_metadata": { \
  \n\n "identified_period": "String (e.g., January Week 2: Pongal Peak)", \
  \n\n "analysis_logic": "String (Briefly explain how sentiment adjusted the historical average using plain text only)" \
  \n\n }, \
  \n\n "financial_projections": { \
  \n\n "opening_day_collection": { \
  \n\n "estimated_range": "String (e.g., Rs.25 cr - Rs.30 cr)", \
  \n\n "confidence_level": "Percentage" \
  \n\n }, \
  \n\n "average_weekend_gross_cumulative": "String (e.g., Rs.100 cr - Rs.120 cr)", \
  \n\n "mean_worldwide_gross_total": "String" \
  \n\n }, \
  \n\n "strategic_fit": { \
  \n\n "optimal_genre": "String", \
  \n\n "key_success_factors": [ \
  \n\n "Factor 1", \
  \n\n "Factor 2", \
  \n\n "Factor 3" \
  \n\n ] \
  \n\n }, \
  \n\n "market_verdict": "String (e.g., Blockbuster / Sleeper Hit / Underperformer)" \
  \n\n } \
  \n\n Instructions: \
  \n\n 1. Analyze the Release Date to identify the specific "Week" and "Month" category from the Historical Data. \
  \n\n 2. Adjust the historical averages based on the Positivity Ratio and Sentiment Score (e.g., scores in the top 20th \
  percentile should result in predictions at the "High" end of historical ranges). \
  \n\n 3. Strictly no tables: Ensure the analysis_logic and other string fields do not contain any | or --- characters \
  used for table generation. \
  \n\n 4. Output the response strictly in JSON format. Do not include any introductory or concluding text. Only return \
  the JSON object."
llm.prompt.generate.conflict.balance="Role: You are a lifelong movie buff who watches new releases constantly across every \
  genre and market, the kind of person friends ask 'is it worth watching?' before they go. Your goal is to assess how the \
  protagonist and antagonist are set up to conflict in a movie, the way you naturally size that up from a synopsis, based \
  only on its synopsis. \
  \n\nTask: Read the synopsis below and rate four aspects of the central conflict as PLAIN INTEGERS on a 1-5 scale. Do \
  not compute any final score yourself — only provide the ratings and a short rationale; the caller derives the final \
  metric. \
  \n\n Ratings (1-5 scale, 1 = low, 5 = high): \
  \n\n - protagonistPower: the protagonist's competence, resources, and agency relative to what the story demands of \
  them. \
  \n\n - antagonistPower: the antagonist's (or opposing force's) competence, resources, and threat level. \
  \n\n - antagonistMotivationClarity: how clearly the synopsis establishes WHY the antagonist opposes the protagonist \
  (1 = no discernible motive, 5 = a fully coherent, understandable motive). \
  \n\n - stakesEscalation: how much the stakes of the conflict appear to grow or intensify across the synopsis \
  (1 = static/flat stakes, 5 = clear escalation). \
  \n\n If the synopsis describes no clear antagonist or opposing force (e.g. a purely internal or ensemble drama), set \
  antagonistPower and antagonistMotivationClarity to 1 and note this in the rationale. \
  \n\n Synopsis: \
  \n\n [Insert Synopsis] \
  \n\n Response Format & Constraints: \
  \n\n Please provide the response strictly in JSON format. \
  \n\n CRITICAL RULE: Do NOT use Markdown tables, ASCII tables, or any grid-based tabular formatting within the JSON \
  string values. All analysis must be plain text. Do not include any field other than the ones listed below. \
  \n\n Required JSON Structure: \
  \n\n JSON \
  \n\n { \
  \n\n "protagonistPower": Integer (1-5), \
  \n\n "antagonistPower": Integer (1-5), \
  \n\n "antagonistMotivationClarity": Integer (1-5), \
  \n\n "stakesEscalation": Integer (1-5), \
  \n\n "rationale": "String (2-3 sentences max, plain text only)" \
  \n\n } \
  \n\n Instructions: \
  \n\n 1. Base every rating strictly on the synopsis text provided — do not invent plot details not present in it. \
  \n\n 2. Ratings must be integers between 1 and 5 inclusive, never a decimal or a range. \
  \n\n 3. Output the response strictly in JSON format. Do not include any introductory or concluding text. Only return \
  the JSON object."

llm.prompt.generate.watched.classification="Role: You are a social-media analyst reviewing short posts about movies. \
  \n\nTask: Read the post below, written about the movie \"[Movie Name]\". Decide whether the post is strong evidence \
  that its author has actually watched the movie — for example, they describe a specific scene, comment on how \
  well an actor performed, react to a plot twist, or otherwise reference something only a viewer would know. General \
  hype, ticket-booking talk, trailer reactions, or reposting someone else's opinion do NOT count as evidence of having \
  watched it. \
  \n\n Post Content: \"[Post Content]\" \
  \n\n Response Format & Constraints: \
  \n\n Please provide the response strictly in JSON format. \
  \n\n CRITICAL RULE: Do NOT use Markdown tables, ASCII tables, or any grid-based tabular formatting. All analysis \
  must be plain text. Do not include any field other than the ones listed below. \
  \n\n Required JSON Structure: \
  \n\n JSON \
  \n\n { \
  \n\n "watched": Boolean (true or false), \
  \n\n "rationale": "String (1 sentence max, plain text only)" \
  \n\n } \
  \n\n Instructions: \
  \n\n 1. Base the decision strictly on the post content provided — do not assume anything not written there. \
  \n\n 2. Output the response strictly in JSON format. Do not include any introductory or concluding text. Only \
  return the JSON object."

llm.prompt.generate.narrative.novelty="Role: You are a lifelong movie buff who watches new releases constantly across every \
  genre and market, the kind of person friends ask 'is it worth watching?' before they go. Your goal is to judge how novel \
  and \"high-concept\" a movie's premise/world feels to you, the way you naturally size that up from a synopsis, based \
  only on its synopsis. \
  \n\nTask: Read the synopsis below and rate four aspects of the premise as PLAIN INTEGERS on a 1-5 scale. Do not \
  compute any final score yourself — only provide the ratings and a short rationale; the caller derives the final \
  metric. \
  \n\n Ratings (1-5 scale, 1 = low, 5 = high): \
  \n\n - premiseClarity: how clearly the core hook could be stated as a single, vivid elevator-pitch sentence \
  (1 = no legible hook, 5 = instantly pitchable). \
  \n\n - worldBuildingDistinctiveness: how unfamiliar or fresh the setting, rules, or central mechanic are relative to \
  common genre conventions (1 = entirely generic/conventional, 5 = highly distinctive). \
  \n\n - hookMemorability: how retellable or sticky the premise is — would someone repeat it to a friend in one \
  sentence and have it land (1 = forgettable, 5 = highly memorable). \
  \n\n - conceptualCollisionRisk: how closely the premise resembles a SPECIFIC existing well-known film or franchise \
  (1 = no resemblance to anything specific, 5 = a near-identical premise to a known film). \
  \n\n Synopsis: \
  \n\n [Insert Synopsis] \
  \n\n Response Format & Constraints: \
  \n\n Please provide the response strictly in JSON format. \
  \n\n CRITICAL RULE: Do NOT use Markdown tables, ASCII tables, or any grid-based tabular formatting within the JSON \
  string values. All analysis must be plain text. Do not include any field other than the ones listed below. \
  \n\n Required JSON Structure: \
  \n\n JSON \
  \n\n { \
  \n\n "premiseClarity": Integer (1-5), \
  \n\n "worldBuildingDistinctiveness": Integer (1-5), \
  \n\n "hookMemorability": Integer (1-5), \
  \n\n "conceptualCollisionRisk": Integer (1-5), \
  \n\n "rationale": "String (2-3 sentences max, plain text only)" \
  \n\n } \
  \n\n Instructions: \
  \n\n 1. Base every rating strictly on the synopsis text provided — do not invent plot details not present in it. \
  \n\n 2. Ratings must be integers between 1 and 5 inclusive, never a decimal or a range. \
  \n\n 3. Output the response strictly in JSON format. Do not include any introductory or concluding text. Only return \
  the JSON object."