  well an actor performed, react to a plot twist, or otherwise reference something only a viewer would know. General \
  hype, ticket-booking talk, trailer reactions, or reposting someone else's opinion do NOT count as evidence of having \
  watched it. \
  \n\n Post Content: \"[Post Content]\" \
  \n\n Response Format & Constraints: \
  \n\n Please provide the response strictly in JSON format. \
  \n\n CRITICAL RULE: Do NOT use Markdown tables, ASCII tables, or any grid-based tabular formatting. All analysis \
  must be plain text. Do not include any field other than the ones listed below. \
  \n\n Required JSON Structure: \
